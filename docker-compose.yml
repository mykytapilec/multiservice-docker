
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: multiservice-frontend
    ports:
      - "8081:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: multiservice-api
    ports:
      - "3002:3000"
    restart: unless-stopped
