services:
  api-base:
    image: multiservice-api-base:latest
    build:
      context: ./api
      dockerfile: Dockerfile.base
    profiles:
      - build

  frontend-base:
    image: multiservice-frontend-base:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile.base
    profiles:
      - build

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: multiservice-nginx
    ports:
      - "8082:80"
    depends_on:
      - frontend
      - api
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: multiservice-frontend
    expose:
      - "80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: multiservice-api
    expose:
      - "3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/multiservice
      REDIS_URL: redis://redis:6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:8
    container_name: multiservice-mongodb
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: multiservice-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
